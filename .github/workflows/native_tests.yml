name: Native Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  BUNDLE_GEMFILE: ${{ github.workspace }}/TestApp/Gemfile

jobs:
  test-native-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prepare Android
        uses: ./.github/actions/prepare-android

      - name: Run Unit Tests for Android
        run: yarn test:android

  test-native-ios:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Prepare iOS
        uses: ./.github/actions/prepare-ios

      - name: Install Test App cocoapods
        run: |
          pod repo update
          (cd TestApp/ios && pod install --verbose)

      - name: Run Unit Tests for iOS
        # The macos-26 image puts the Metal toolchain ahead of XcodeDefault in TOOLCHAINS,
        # so TOOLCHAIN_DIR resolves to Metal.xctoolchain, which lacks the Swift back-deploy
        # libs (swiftCompatibility56) and the ObjC-only test bundle fails to link.
        env:
          TOOLCHAINS: com.apple.dt.toolchain.XcodeDefault
        run: yarn test:ios
